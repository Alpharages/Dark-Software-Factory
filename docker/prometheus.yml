# Prometheus configuration for Dark Software Factory
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # AI Dev Orchestrator metrics (Docker service)
  - job_name: 'dsf-app-docker'
    static_configs:
      - targets: ['app:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # AI Dev Orchestrator metrics (Local development on host)
  - job_name: 'dsf-app-local'
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s
