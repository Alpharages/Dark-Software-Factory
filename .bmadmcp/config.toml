# BMAD MCP — project pins for the clickup-create-story / -epic / -review workflows.
# Lets future runs skip the space + backlog-list pickers for this project.
#
# This Team Space is shared across many projects and has no space-level "Backlog"
# list, so the DSF project's own list ("Dark Software Factory") acts as the
# epic/Backlog list. Stories are created as subtasks of their epic in that list.

[clickup]
pinned_space_id = "90182124701"
pinned_space_name = "Team Space"
pinned_backlog_list_id = "901813518753"

[clickup_create_story]
# Allow creating stories without an epic parent (standalone tasks). Default: true.
allow_no_epic = true
pinned_sprint_folder_id = "901813518753"

# ---------------------------------------------------------------------------
# Doc-path cascade — this project keeps planning docs under docs/, not the
# default planning-artifacts/. Paths are relative to the project root.
# ---------------------------------------------------------------------------

[docs]
prd_path          = "docs/prd.md"
architecture_path = "docs/architecture.md"
epics_path        = "docs/epics.md"