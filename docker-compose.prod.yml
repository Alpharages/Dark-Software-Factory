# ===========================================
# Dark Software Factory - Production Stack
# ===========================================
# Usage:
#   Start:          docker-compose -f docker-compose.prod.yml up -d
#   Logs:           docker-compose -f docker-compose.prod.yml logs -f
#   Stop:           docker-compose -f docker-compose.prod.yml down
#   Shell:          docker-compose -f docker-compose.prod.yml exec app sh
#   Seed (1st deploy only): docker exec dsf-app node dist-seed/prisma/seed.js
# ===========================================

name: dark-software-factory

services:
  # ===========================================
  # RabbitMQ Message Queue
  # ===========================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: dsf-rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dsf-network
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ===========================================
  # Database Migrations (runs before app, exits after)
  # ===========================================
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dsf-migrate
    env_file:
      - .env
    environment:
      NODE_ENV: production
    command: npx prisma migrate deploy
    networks:
      - dsf-network
      - mynet
      - redis-net
    restart: 'no'
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '2'

  # ===========================================
  # AI Dev Orchestrator Application
  # ===========================================
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dsf-app
    user: "root"
    env_file:
      - .env
    environment:
      # Hardcoded — must not be overridden by .env
      NODE_ENV: production
      PORT: 3000

    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      # Docker socket for DooD pattern (Story 22.1) — no source mounts in production
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/v1/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - dsf-network
      - mynet
      - redis-net
    restart: unless-stopped
    # Resource limits (prevents OOM during Prisma generate and AI operations)
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    # TTY support for node-pty (Epic 19)
    tty: true
    stdin_open: true

# ===========================================
# Networks
# ===========================================
networks:
  dsf-network:
    driver: bridge
    name: dsf-network-prod
  # Postgres lives on this network — container resolvable as 'postgres_container'
  mynet:
    external: true
    name: mynet
  # Redis lives on this network — container resolvable as 'redis'
  redis-net:
    external: true
    name: redis-net

# ===========================================
# Volumes
# ===========================================
volumes:
  rabbitmq_data:
    driver: local
    name: dsf-rabbitmq-data-prod
